name: Speed catalog branch checks
on:
  push:
    branches: [feature/speed-catalog-data-pipeline]
    paths:
      - 'tools/**'
      - '.github/workflows/ndw-speed-catalog.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall -q tools
      - name: Catalog tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Record result
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const path = '.github/status/catalog-ci.json';
            const payload = {
              run_id: context.runId, source_sha: context.sha,
              result: '${{ job.status }}',
              run_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`
            };
            let sha;
            try {
              const old = await github.rest.repos.getContent({owner, repo, path, ref: context.ref});
              sha = old.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, sha,
              branch: context.ref.replace('refs/heads/',''),
              message: 'chore(ci): record speed catalog test result',
              content: Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64')
            });
