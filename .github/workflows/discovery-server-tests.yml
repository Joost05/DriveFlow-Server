name: DriveFlow Discovery server verification

on:
  push:
    branches: [main, feature/discovery-place-parity, feature/discovery2-national-catalog-alpha1, feature/discovery2-reviewed-migration-preview]
    paths:
      - "driveflow_server/**"
      - ".github/workflows/discovery-server-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovery-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discovery-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q driveflow_server
      - name: Test both discovery catalogues and province recovery
        working-directory: driveflow_server
        run: python -m unittest -v test_road_discovery_store test_discovery_places test_discovery_sync_recovery test_discovery_http_contract test_discovery_statistics test_province_statistics test_province_progress test_discovery2_catalog_builder test_compare_discovery2_catalogs test_discovery2_upload test_discovery2_analysis test_discovery2_shadow test_discovery2_clients test_discovery2_readiness test_discovery2_review test_discovery2_audit
      - name: Build Home Assistant app image
        run: docker build -t driveflow-discovery-test ./driveflow_server
      - name: Verify all runtime modules are included
        run: |
          docker run --rm --entrypoint python driveflow-discovery-test -c "import server, discovery_places, road_discovery_store, province_statistics, discovery2_readiness, discovery2_shadow, discovery2_clients, discovery2_review, discovery2_audit"
